[project]
name = "sample-api"
version = "0.1.0"
description = "Tiny FastAPI app used as a Rift test fixture."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
