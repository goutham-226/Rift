[project]
name = "rift"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Goutham", email = "gouthambalaji226143@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "docker>=7.2.0",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "rich>=15.0.0",
    "typer>=0.28.0",
]

[project.scripts]
rift = "rift.cli:app"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

#use ruff for source formatting
[tool.ruff]
line-length = 100
target-version = "py314"

# test path is tests/
[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
